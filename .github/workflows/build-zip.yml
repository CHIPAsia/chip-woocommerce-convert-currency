name: Build release zip

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Generate zip
      run: |
        # Create zip file using git archive which automatically respects .gitignore
        git archive --format=zip --output=chip-woo-convert-currency.zip HEAD
        
        echo "✅ Created chip-woo-convert-currency.zip"
        ls -lh chip-woo-convert-currency.zip

    - name: Upload zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: chip-woo-convert-currency
        path: chip-woo-convert-currency.zip
        retention-days: 5